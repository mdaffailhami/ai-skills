<!--
  Collapsible section — native <details>/<summary> with design tokens

  USAGE: Use for secondary content, supplementary explanations, code references,
  extended examples, and footnotes. Choose a relevant Lucide icon.
-->

<details class="border border-border rounded-xl bg-surface overflow-hidden mb-4">
  <summary class="cursor-pointer px-5 py-4 flex items-center gap-3">
    <i data-lucide="folder-tree" class="w-4 h-4 text-muted shrink-0"></i>
    <span class="text-lg text-heading">Section Title</span>
    <span class="ml-auto text-xs font-mono text-muted">optional source</span>
  </summary>
  <div class="px-5 pb-5 text-sm text-text leading-relaxed">
    <p>Content goes here. Supports any HTML.</p>
  </div>
</details>

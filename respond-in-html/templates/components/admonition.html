<!--
  Admonition — 5 variants

  USAGE: Copy the block for a single variant. Replace the icon and inner content.

  Variants and their Lucide icons:
    info    — info
    success — check-circle
    warning — alert-triangle
    danger  — x-octagon
    tip     — lightbulb

  Icon color classes (use with lucide icon element):
    text-info / text-success / text-warn / text-danger / text-tip
-->

<!-- INFO -->
<div class="bg-info/10 border border-info/25 border-l-4 border-l-info rounded-xl p-5 flex gap-4">
  <i data-lucide="info" class="w-5 h-5 text-info shrink-0 mt-0.5"></i>
  <div>
    <div class="text-sm font-semibold text-info uppercase tracking-wider mb-1">Note</div>
    <div class="text-text text-sm leading-relaxed">...</div>
  </div>
</div>

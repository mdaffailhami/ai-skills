<!--
  Feature card — icon, title, description, optional link

  USAGE: Use in a grid (grid-cols-1 md:grid-cols-2 lg:grid-cols-3).
  Pick a Lucide icon that matches the feature.
-->

<div class="bg-surface border border-border rounded-xl p-6 hover:border-accent/30 hover:shadow-sm transition-all group">
  <div class="w-10 h-10 rounded-lg bg-accent/10 flex items-center justify-center mb-4 group-hover:bg-accent/15 transition-colors">
    <i data-lucide="zap" class="w-5 h-5 text-accent"></i>
  </div>
  <h4 class="text-lg font-semibold text-heading mb-2">Feature Title</h4>
  <p class="text-text text-sm leading-relaxed">Concise description of what this feature does and why it matters.</p>
</div>
